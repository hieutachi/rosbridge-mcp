[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosbridge-mcp"
version = "0.2.0"
description = "MCP server bridging AI agents (Claude, Cursor, VS Code) to ROS 2 robots via rosbridge WebSockets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "N4G" }]
keywords = [
  "mcp",
  "ros",
  "ros2",
  "rosbridge",
  "robotics",
  "ai-agent",
  "model-context-protocol",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "fastmcp>=2,<3",
  "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
rosbridge-mcp = "rosbridge_mcp.server:main"

[project.urls]
Homepage = "https://github.com/hieutachi/rosbridge-mcp"
Repository = "https://github.com/hieutachi/rosbridge-mcp"
Issues = "https://github.com/hieutachi/rosbridge-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["rosbridge_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
